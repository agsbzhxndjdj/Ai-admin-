name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ✨ الخطوة السحرية: توليد كل ملفات فلتر القياسية الناقصة تلقائياً
      # بدون أن تمس ملفاتك الموجودة
      - name: Scaffold missing files
        run: flutter create --platforms=android --org com.example --project-name refine_loop .

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: refine-loop-apk
          path: build/app/outputs/flutter-apk/app-release.apk
